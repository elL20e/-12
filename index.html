<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اختبار الوحدات</title>
<style>
  body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #000;
  }

  #question {
      font-size: 1.8em;
      font-weight: bold;
      margin: 30px 0;
      text-align: center;
      color: #1a1a1a;
      max-width: 800px;
  }

  #choicesContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
  }

  .choice {
      background-color: #fff;
      border: 2px solid #ff7f50;
      border-radius: 10px;
      padding: 12px 25px;
      cursor: pointer;
      font-size: 1.2em;
      font-weight: 600;
      transition: all 0.3s ease;
  }

  .choice:hover {
      transform: scale(1.05);
      background-color: #ff7f50;
      color: #fff;
  }

  .correct {
      background-color: #4caf50 !important;
      color: white;
      border-color: #4caf50 !important;
  }

  .wrong {
      background-color: #f44336 !important;
      color: white;
      border-color: #f44336 !important;
  }

  #nextBtn, #skipBtn {
      background-color: #ff7f50;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 1.2em;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
  }

  #nextBtn:hover, #skipBtn:hover {
      background-color: #ff4500;
  }

  #score {
      font-size: 1.3em;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
      color: #000;
  }
</style>
</head>
<body>

<h2 id="question">تحميل السؤال...</h2>

<div id="choicesContainer"></div>

<p id="score"></p>
<button id="nextBtn">التالي</button>
<button id="skipBtn">تخطي الوحدة</button>

<!-- استدعاء السكربت الخارجي -->
<script src="script.js"></script>
</body>
</html>
